[workspace]
resolver = "3"
members = [
    "crates/ink-core",
    "crates/ink-backend",
    "crates/ink-media",
    "app/ink-mixer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# egui / eframe 0.36 needs Rust 1.95 (ADR-0004).
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false
