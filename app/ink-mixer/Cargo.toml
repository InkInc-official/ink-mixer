[package]
name = "ink-mixer"
description = "Ink Mixer: extensible real-time audio console for streamers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
# GUI (ADR-0004). OpenGL (glow) is the default renderer; the fonts come from
# Noto Sans JP (ADR-0006), so egui's bundled fonts ("default_fonts") are off.
eframe = { version = "0.36.2", default-features = false, features = ["glow", "x11", "wayland"] }
ink-backend = { path = "../../crates/ink-backend" }
ink-core = { path = "../../crates/ink-core" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
# Use the wgpu renderer instead of glow (ADR-0004). Not enabled by default.
wgpu = ["eframe/wgpu"]
